[package]
name = "gemma2-probe"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candid = "=0.10.39"
ic-cdk = "=0.20.3"
serde_bytes = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pocket-ic = "=11.0.0"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
