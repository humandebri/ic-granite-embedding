name: Rust checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain and formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test integer math, codecs, and API bounds
        run: cargo test --locked -p granite-core --features approx-gelu,strassen,chunked-gemm,strassen-wo,strassen-qkv,strassen-out
      - name: Check benchmark client
        run: cargo check --locked -p granite-bench
      - name: Check public Candid
        run: |
          cargo run --quiet --release --locked -p granite-canister --example export_candid > "$RUNNER_TEMP/granite.did"
          diff -u crates/canister/granite.did "$RUNNER_TEMP/granite.did"
      - name: Build production Wasm
        run: cargo build --release --locked -p granite-canister --target wasm32-unknown-unknown
