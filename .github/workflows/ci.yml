name: Rust checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bekko25-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup show active-toolchain
      - name: Test Bekko a25m loader and compile all host clients
        run: cargo test --release --locked -p bekko25-bench --bins
      - name: Check storage-format selection with all features
        run: cargo test --release --locked --all-features -p bekko25-canister -p bekko25-compact-canister --lib
      - name: Test build provenance and report generation
        run: python3 -m unittest discover -s scripts -p 'test_bekko25*.py' -v
      - name: Check Bekko a25m public Candid
        run: |
          cargo run --quiet --release --locked -p bekko25-canister --example export_candid > "$RUNNER_TEMP/bekko25.did"
          diff -u crates/bekko25-canister/bekko25.did "$RUNNER_TEMP/bekko25.did"
          cargo run --quiet --release --locked -p bekko25-compact-canister --example export_candid > "$RUNNER_TEMP/bekko25-compact.did"
          diff -u crates/bekko25-canister/bekko25.did "$RUNNER_TEMP/bekko25-compact.did"
      - name: Build Bekko a25m production Wasm
        run: cargo build --release --locked -p bekko25-canister -p bekko25-compact-canister --target wasm32-unknown-unknown

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain and formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test integer math, codecs, and API bounds
        run: cargo test --locked -p granite-core --features approx-gelu,strassen,chunked-gemm,strassen-wo,strassen-qkv,strassen-out
      - name: Check benchmark client
        run: cargo check --locked -p granite-bench
      - name: Check public Candid
        run: |
          cargo run --quiet --release --locked -p granite-canister --example export_candid > "$RUNNER_TEMP/granite.did"
          diff -u crates/canister/granite.did "$RUNNER_TEMP/granite.did"
      - name: Build production Wasm
        run: cargo build --release --locked -p granite-canister --target wasm32-unknown-unknown

      - name: Test Bekko input bounds and numerical kernels
        run: cargo test --locked -p bekko-core
      - name: Check Bekko clients
        run: cargo check --locked -p bekko-bench
      - name: Check Bekko public Candid
        run: |
          cargo run --quiet --release --locked -p bekko-canister --example export_candid > "$RUNNER_TEMP/bekko.did"
          diff -u crates/bekko-canister/bekko.did "$RUNNER_TEMP/bekko.did"
      - name: Build Bekko Wasm
        run: cargo build --release --locked -p bekko-canister --target wasm32-unknown-unknown
