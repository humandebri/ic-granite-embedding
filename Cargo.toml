[workspace]
members = ["crates/core", "crates/canister", "crates/bench", "crates/kernel-gen", "crates/bekko-core", "crates/bekko-canister", "crates/bekko-bench"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candid = "=0.10.39"
serde_bytes = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"
